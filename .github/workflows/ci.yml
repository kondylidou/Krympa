name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install OCaml + dune (via opam)
        run: |
          sudo apt-get update
          sudo apt-get install -y ocaml ocaml-findlib opam m4 pkg-config
          opam init -a --disable-sandboxing
          eval "$(opam env)"
          opam install -y dune

      - name: Format check
        run: |
          eval "$(opam env)"
          cargo fmt --all -- --check

      - name: Lint (clippy)
        run: |
          eval "$(opam env)"
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: |
          eval "$(opam env)"
          cargo test --workspace --all-targets --all-features
